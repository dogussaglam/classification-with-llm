[project]
name = "llm-textcls"
version = "0.1.0"
description = "Replication + extension of Kostina et al. 2025 on LLM text classification."
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=15",
    "python-dotenv>=1.0",
    "tiktoken>=0.7",
    "requests>=2.31",
    "trafilatura>=1.10",
    "datasets>=2.20",
    "scikit-learn>=1.5",
    "matplotlib>=3.9",
    # Phase 2 baselines.
    # NOTE: install torch with CUDA support FIRST, before `pip install -e .`,
    # otherwise transformers pulls the CPU wheel from PyPI:
    #   pip install torch --index-url https://download.pytorch.org/whl/cu121
    "xgboost>=2.0",
    "transformers>=4.44",
    "accelerate>=0.30",
    # Phase 3 LLM benchmark.
    "groq>=0.18",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
